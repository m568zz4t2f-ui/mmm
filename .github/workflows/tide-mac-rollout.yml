name: Tide 1.3.1 Mac test rollout

on:
  push:
    branches: [ui/deep-current-complete]
    paths:
      - '.github/workflows/tide-mac-rollout.yml'
      - 'Source/**'
      - 'CMakeLists.txt'
      - 'scripts/**'
      - 'tests/**'
      - 'assets/tide/deep-current-studio/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tide-mac-rollout-${{ github.ref }}
  cancel-in-progress: false

jobs:
  mac:
    name: Universal build and native validation (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Prepare build tools
        run: |
          python -m pip install --disable-pip-version-check 'Pillow>=11,<13' 'cmake>=3.22,<5'
          mkdir -p dist/logs
          sw_vers | tee dist/logs/runner.txt
          uname -m | tee -a dist/logs/runner.txt
          xcodebuild -version | tee -a dist/logs/runner.txt
      - name: Verify exact upgrade and immutable artwork
        run: |
          set -o pipefail
          python scripts/verify-studio-artwork.py | tee dist/logs/artwork.json
          python scripts/check-deep-current.py | tee dist/logs/preservation.txt
          python tests/test_studio_recovery.py 2>&1 | tee dist/logs/recovery.txt
      - name: Build universal AU VST3 standalone and package using existing path
        run: bash scripts/Build-Mac.command
      - name: Inspect architectures minimum OS package and source
        run: |
          set -o pipefail
          python scripts/inspect-mac-artifacts.py | tee dist/logs/inspection.txt
          pkgutil --expand-full dist/Wolf-Tide-1.3.1-unsigned.pkg "$RUNNER_TEMP/tide-expanded"
          test -f "$RUNNER_TEMP/tide-expanded/Payload/Library/Application Support/Wolf Audio/Wolf Tide/IBM-Plex-Sans-OFL.txt"
          pkgutil --check-signature dist/Wolf-Tide-1.3.1-unsigned.pkg > dist/logs/installer-signature.txt 2>&1 || status=$?
          test "${status:-0}" -eq 1
      - name: Install on disposable CI Mac and validate native AU
        run: |
          set -o pipefail
          sudo installer -pkg dist/Wolf-Tide-1.3.1-unsigned.pkg -target / 2>&1 | tee dist/logs/install.txt
          auval -a > dist/logs/au-scan.txt 2>&1
          auval -v aufx Wtid Wolf 2>&1 | tee dist/logs/auval.txt
          grep -q 'AU VALIDATION SUCCEEDED' dist/logs/auval.txt
          grep -q 'Component Version: 1.3.1' dist/logs/auval.txt
          codesign --verify --strict '/Library/Audio/Plug-Ins/Components/Wolf Tide.component'
          codesign --verify --strict '/Library/Audio/Plug-Ins/VST3/Wolf Tide.vst3'
          codesign -d --verbose=4 '/Library/Audio/Plug-Ins/VST3/Wolf Tide.vst3' > dist/logs/bundle-signature.txt 2>&1
      - name: Validate installed VST3 with pinned native pluginval
        run: |
          set -o pipefail
          curl -fLsS --retry 3 https://github.com/Tracktion/pluginval/releases/download/v1.0.4/pluginval_macOS.zip -o "$RUNNER_TEMP/pluginval.zip"
          echo '3c4c533bda0c5059eea3ddaea752d757ee2025041f0f47e6bcb0e87f6082b29f  '"$RUNNER_TEMP/pluginval.zip" | shasum -a 256 -c -
          ditto -x -k "$RUNNER_TEMP/pluginval.zip" "$RUNNER_TEMP/pluginval"
          validator="$RUNNER_TEMP/pluginval/pluginval.app/Contents/MacOS/pluginval"
          lipo -verify_arch "$(uname -m)" "$validator"
          "$validator" --strictness-level 5 --validate '/Library/Audio/Plug-Ins/VST3/Wolf Tide.vst3' 2>&1 | tee dist/logs/pluginval.txt
      - name: Preserve test evidence and checksums
        if: always()
        run: |
          mkdir -p dist/logs
          if test -f build-mac/Testing/Temporary/LastTest.log; then cp build-mac/Testing/Temporary/LastTest.log dist/logs/CTest.txt; fi
          cp docs/ROLLOUT-1.3.1.md dist/Read-Before-Installing.md
          git rev-parse HEAD > dist/Source-Revision.txt
          cd dist
          find . -type f ! -name SHA256SUMS.txt -exec shasum -a 256 {} \; | LC_ALL=C sort > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Wolf-Tide-1.3.1-${{ matrix.runner }}-${{ github.sha }}
          path: dist/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
