name: Recover existing Tide Studio Higgsfield originals

on:
  push:
    branches: [ui/deep-current-complete]
    paths:
      - '.github/workflows/tide-studio-recovery.yml'
      - 'scripts/import-studio-artwork.py'
      - 'docs/deep-current-studio/recovered-higgsfield-jobs.json'
      - 'docs/deep-current-studio/correction-jobs.json'
      - 'scripts/import-studio-corrections.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: tide-studio-artwork-recovery
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check 'Pillow>=11,<13'
      - name: Test recovery integrity guards
        run: python tests/test_studio_recovery.py
      - name: Verify protected processing and unchanged recovered originals
        run: python scripts/import-studio-artwork.py --verify-only --allow-visual-changes
      - name: Import completed material corrections, preserving original bytes
        run: |
          if test -f docs/deep-current-studio/correction-jobs.json; then
            python scripts/import-studio-corrections.py
          fi
      - name: Verify prepared skins, font licenses and protected hashes
        run: python scripts/verify-studio-artwork.py
      - uses: actions/upload-artifact@v4
        with:
          name: tide-studio-recovery-review
          path: |
            docs/deep-current-studio/recovered-artwork-receipt.json
            docs/deep-current-studio/correction-artwork-receipt.json
            assets/tide/deep-current-studio/runtime/manifest.json
            assets/tide/deep-current-studio/review/
      - name: Commit recovered originals to the same branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/tide/deep-current-studio/ docs/deep-current-studio/recovered-artwork-receipt.json
          if test -f docs/deep-current-studio/correction-artwork-receipt.json; then
            git add docs/deep-current-studio/correction-artwork-receipt.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'Preserve recovered Studio Higgsfield originals and integrity receipt [skip ci]'
            git push origin HEAD:ui/deep-current-complete
          fi
